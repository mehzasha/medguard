<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedGuard Login</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--ink:#1b2430;--muted:#6b7686;--line:#e3e8ef;--bad:#d64545;--brand:#1f4e8c}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
  .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;width:100%;max-width:380px}
  h1{margin:0 0 4px;font-size:20px;color:var(--brand)}
  p{margin:0 0 18px;color:var(--muted);font-size:13px}
  label{display:block;font-size:13px;margin:12px 0 4px}
  input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}
  button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:8px;background:var(--brand);
         color:#fff;font:inherit;cursor:pointer}
  button:hover{opacity:.92}
  #err{color:var(--bad);font-size:13px;margin-top:12px;min-height:18px}
  .demo{margin-top:18px;padding:10px;background:#eef6ff;border-radius:8px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="box">
  <h1>MedGuard</h1>
  <p>Authorized staff only. Sign in to review device alerts.</p>
  <label for="u">Username</label>
  <input id="u" autocomplete="username" autofocus>
  <label for="p">Password</label>
  <input id="p" type="password" autocomplete="current-password">
  <button onclick="signIn()">Sign in</button>
  <div id="err"></div>
  <div class="demo">
    <strong>Demo accounts (synthetic, prototype only):</strong><br>
    Clinician: nurse1 / nurse-demo-123 (can approve or reject)<br>
    Observer: viewer1 / viewer-demo-123 (read-only)
  </div>
</div>
<script>
async function signIn(){
  const err = document.getElementById("err");
  err.textContent = "";
  const r = await fetch("/api/login", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      username: document.getElementById("u").value.trim(),
      password: document.getElementById("p").value
    })
  });
  if(r.ok){ window.location = "/"; }
  else { err.textContent = "Wrong username or password."; }
}
document.addEventListener("keydown", e => { if(e.key === "Enter") signIn(); });
</script>
</body>
</html>
